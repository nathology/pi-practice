[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepi-voice"
version = "0.1.0"
description = "An offline voice-controlled Pi game for memorizing digits"
dependencies = [
    "vosk",
    "soundfile",
    "rpi.gpio",
    "luma.oled",
    "gpiozero"
]